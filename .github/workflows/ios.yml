name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test CollectiveKit and build app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Test CollectiveKit
        shell: bash
        run: swift test --package-path ios/CollectiveKit

      - name: Build app for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CollectiveUI.xcodeproj \
            -scheme CollectiveUI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -200

      - name: Build app for iOS Simulator (Release, no demo mode)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CollectiveUI.xcodeproj \
            -scheme CollectiveUI \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -100

      - name: Test native draft and session behavior
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in devices.items():
              if ".iOS-" not in runtime:
                  continue
              for device in entries:
                  if device.get("isAvailable", True) and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')"
          set -o pipefail
          xcodebuild test \
            -project ios/CollectiveUI.xcodeproj \
            -scheme CollectiveUI \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -only-testing:CollectiveUITests \
            QA_APP_BUNDLE_IDENTIFIER=io.collectiveui.qa \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -150

      - name: Show compiler errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/xcodebuild.log" ]; then
            grep -nE "error:|fatal error" "$RUNNER_TEMP/xcodebuild.log" | head -100 || true
          fi

  regressions:
    name: Native iOS regression tests
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version

      - name: Build separate QA app for fixtures
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CollectiveUI.xcodeproj \
            -scheme CollectiveUI \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/qa-app" \
            QA_APP_BUNDLE_IDENTIFIER=io.collectiveui.qa \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/qa-build.log" | tail -100

      - name: Run offline UI regressions
        shell: bash
        run: |
          bash ios/scripts/simulator-regressions.sh \
            "$RUNNER_TEMP/qa-app/Build/Products/Debug-iphonesimulator/CollectiveUI.app" \
            "$RUNNER_TEMP/ios-regressions"

      - name: Export regression screenshots
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/ios-regressions/Regression.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/ios-regressions/Regression.xcresult" \
              --output-path "$RUNNER_TEMP/ios-regressions/screenshots"
          fi

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-regressions
          path: |
            ${{ runner.temp }}/ios-regressions
            ${{ runner.temp }}/qa-build.log
          retention-days: 14
          if-no-files-found: warn

  screenshots:
    name: Simulator screenshots
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build Debug app for the simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CollectiveUI.xcodeproj \
            -scheme CollectiveUI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DD \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-debug.log" | tail -100
          test -d build/DD/Build/Products/Debug-iphonesimulator/CollectiveUI.app

      - name: Capture screenshots and video
        shell: bash
        run: |
          bash ios/scripts/simulator-screenshots.sh \
            build/DD/Build/Products/Debug-iphonesimulator/CollectiveUI.app \
            "$RUNNER_TEMP/ios-screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/ios-screenshots
          retention-days: 14
          if-no-files-found: warn
