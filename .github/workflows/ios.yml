name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test CollectiveKit and build app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Test CollectiveKit
        shell: bash
        run: swift test --package-path ios/CollectiveKit

      - name: Build app for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CollectiveUI.xcodeproj \
            -scheme CollectiveUI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -200

      - name: Show compiler errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/xcodebuild.log" ]; then
            grep -nE "error:|fatal error" "$RUNNER_TEMP/xcodebuild.log" | head -100 || true
          fi
