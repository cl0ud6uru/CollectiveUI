name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test CollectiveKit and build app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Test CollectiveKit
        shell: bash
        run: swift test --package-path ios/CollectiveKit

      - name: Build app for iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CollectiveUI.xcodeproj \
            -scheme CollectiveUI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -200

      - name: Build app for iOS Simulator (Release, no demo mode)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CollectiveUI.xcodeproj \
            -scheme CollectiveUI \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | tail -100

      - name: Show compiler errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/xcodebuild.log" ]; then
            grep -nE "error:|fatal error" "$RUNNER_TEMP/xcodebuild.log" | head -100 || true
          fi

  screenshots:
    name: Simulator screenshots
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build Debug app for the simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CollectiveUI.xcodeproj \
            -scheme CollectiveUI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DD \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-debug.log" | tail -100
          test -d build/DD/Build/Products/Debug-iphonesimulator/CollectiveUI.app

      - name: Capture screenshots and video
        shell: bash
        run: |
          bash ios/scripts/simulator-screenshots.sh \
            build/DD/Build/Products/Debug-iphonesimulator/CollectiveUI.app \
            "$RUNNER_TEMP/ios-screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/ios-screenshots
          retention-days: 14
          if-no-files-found: warn
