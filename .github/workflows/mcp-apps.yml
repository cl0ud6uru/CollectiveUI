name: Synthetic MCP Apps
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mcp-apps:browser
