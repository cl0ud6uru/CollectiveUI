name: Disposable Docker Hermes browser acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/docker-hermes-browser.yml'
      - 'scripts/run-docker-hermes-browser-acceptance.mjs'
      - 'scripts/lib/docker-hermes-browser-guard.mjs'
      - 'scripts/lib/docker-hermes-browser-reporter.mjs'
      - 'tests/unit/docker-hermes-browser-reporter.test.mjs'
      - 'tests/unit/docker-hermes-browser-guard.test.mjs'

permissions:
  contents: read

concurrency:
  group: docker-hermes-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accepted-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Accepted SHA · real app and worker · synthetic Docker broker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: fixture-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: collective_docker_hermes_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCEPTANCE_APP_SHA: 78518aa6b5c35fe37485d8741893fbf361202f9d
      ACCEPTANCE_HARNESS_SHA: ${{ github.event.pull_request.head.sha }}
      DOCKER_HERMES_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 78518aa6b5c35fe37485d8741893fbf361202f9d
          path: acceptance-target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the refusal guard before application or database imports
        env:
          DISPOSABLE_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          DATABASE_URL: postgres://postgres:fixture-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:${{ job.services.postgres.ports[5432] }}/collective_docker_hermes_test
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/acceptance-chromium
        run: |
          env -i PATH="$PATH" HOME="$HOME" node --test tests/unit/docker-hermes-browser-guard.test.mjs tests/unit/docker-hermes-browser-reporter.test.mjs
          env -i PATH="$PATH" HOME="$HOME" \
            CI=true GITHUB_ACTIONS=true \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            ACCEPTANCE_APP_SHA="$ACCEPTANCE_APP_SHA" ACCEPTANCE_HARNESS_SHA="$ACCEPTANCE_HARNESS_SHA" \
            DOCKER_HERMES_BROWSER=1 DISPOSABLE_PG_PORT="$DISPOSABLE_PG_PORT" \
            DATABASE_URL="$DATABASE_URL" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            node scripts/run-docker-hermes-browser-acceptance.mjs --guard-only
      - name: Install the pinned accepted application's dependencies and isolated Chromium
        working-directory: acceptance-target
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/acceptance-chromium
        run: |
          env -i PATH="$PATH" HOME="$HOME" npm ci --no-audit --no-fund
          env -i PATH="$PATH" HOME="$HOME" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" npx playwright install --with-deps chromium
      - name: Run every opt-in browser case against the exact accepted app and spec
        env:
          DISPOSABLE_PG_PORT: ${{ job.services.postgres.ports[5432] }}
          DATABASE_URL: postgres://postgres:fixture-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:${{ job.services.postgres.ports[5432] }}/collective_docker_hermes_test
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/acceptance-chromium
        run: |
          env -i PATH="$PATH" HOME="$HOME" \
            CI=true GITHUB_ACTIONS=true \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            ACCEPTANCE_APP_SHA="$ACCEPTANCE_APP_SHA" ACCEPTANCE_HARNESS_SHA="$ACCEPTANCE_HARNESS_SHA" \
            DOCKER_HERMES_BROWSER=1 DISPOSABLE_PG_PORT="$DISPOSABLE_PG_PORT" \
            DATABASE_URL="$DATABASE_URL" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            node scripts/run-docker-hermes-browser-acceptance.mjs
      - name: Upload sanitized aggregate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-hermes-accepted-sha-evidence
          path: acceptance-evidence/summary.json
          if-no-files-found: warn
          retention-days: 7
