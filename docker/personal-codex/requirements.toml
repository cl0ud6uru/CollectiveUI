# Immutable managed requirements; installed in the reviewed image, outside writable volumes.
allowed_login_methods = ["chatgpt"]
cli_auth_credentials_store = "file"
# Native mode uses stock Codex's managed ChatGPT provider. The optional SIWC
# provider is selected by the trusted supervisor only while its token is present.
model_providers.openai_chatgpt_plan.name = "ChatGPT plan"
model_providers.openai_chatgpt_plan.base_url = "https://api.openai.com/v1"
model_providers.openai_chatgpt_plan.env_key = "ACCESS_TOKEN"
model_providers.openai_chatgpt_plan.wire_api = "responses"
model_providers.openai_chatgpt_plan.requires_openai_auth = false
model_providers.openai_chatgpt_plan.supports_websockets = false
# Never pass the app-server credential into a shell or its subprocesses.
shell_environment_policy = { inherit = "none", filters = { ACCESS_TOKEN = "exclude" } }
allowed_approval_policies = ["on-request"]
allowed_approvals_reviewers = ["user"]
allowed_sandbox_modes = ["workspace-write", "read-only"]
default_permissions = "collective-personal"
allow_login_shell = false
check_for_update_on_startup = false
allow_managed_hooks_only = true
allow_browser_and_computer_use = false
allow_appshots = false
allow_remote_control = false
allowed_web_search_modes = ["disabled"]

[allowed_permission_profiles]
collective-personal = true

[permissions.filesystem]
# The private home is absent from the stock sandbox's read allowlist. Keep
# credential masks as defense in depth without a conflicting parent mask.
deny_read = ["/codex-home/auth.json", "/codex-home/config.toml", "/codex-home/sessions", "/codex-home/archived_sessions", "/codex-home/history.jsonl", "/codex-home/log", "/codex-home/logs", "/codex-home/.collective-codex-siwc.sock", "/sys"]

[permissions.collective-personal.filesystem]
":minimal" = "read"
"/opt/codex" = "read"
"/opt/collective-codex" = "read"
"/home/agent/workspace" = "write"
"/tmp" = "write"
"/home/agent/workspace/.codex" = "deny"
# Stock Codex grants its exact active arg0 helper read access automatically.
# Its fresh PID namespace/procfs must pass the parent-process isolation proof.

[permissions.collective-personal.network]
enabled = false

[feature_requirements]
hooks = false
memories = false
use_legacy_landlock = false
plugins = false
plugin_hooks = false
enable_mcp_apps = false
multi_agent = false
multi_agent_v2 = false
image_generation = false
