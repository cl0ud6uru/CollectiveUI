# Disposable worker smoke test only. No host ports, host credentials, or external runtime network.
x-worker: &worker
  image: ${WORKER_IMAGE:-collectiveui-worker:test}
  init: true
  environment:
    DATABASE_URL: postgres://fixture:fixture@db:5432/collective_worker_test
    AUTH_URL: http://localhost:3000
    AUTH_LOCAL_ENABLED: "true"
    AUTH_ENTRA_ENABLED: "false"
    LDAP_ENABLED: "false"
    # Public synthetic keys, valid only for this disposable fixture database.
    ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    AUTH_SECRET: worker-image-smoke-fixture-only
  networks: [fixture]

services:
  db:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB: collective_worker_test
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fixture -d collective_worker_test"]
      interval: 1s
      timeout: 5s
      retries: 60
    networks: [fixture]
  mock:
    image: ${WORKER_IMAGE:-collectiveui-worker:test}
    command: [node, /fixture/server.mjs]
    volumes:
      - ${SMOKE_MOCK_DIR:-../../dev/mock-llm}:/fixture:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4010/v1/models').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 1s
      timeout: 5s
      retries: 30
    networks: [fixture]
  worker:
    <<: *worker
    stop_grace_period: 45s
    volumes:
      - uploads:/data/uploads
  web:
    image: ${WEB_IMAGE:-collectiveui-web:test}
    init: true
    environment:
      DATABASE_URL: postgres://fixture:fixture@db:5432/collective_worker_test
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: worker-image-smoke-fixture-only
      AUTH_LOCAL_ENABLED: "true"
      AUTH_ENTRA_ENABLED: "false"
      LDAP_ENABLED: "false"
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      STORAGE_DIR: /data/uploads
      PORT: "3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }
      worker: { condition: service_healthy }
    networks: [fixture]
  check:
    <<: *worker
    command: [node, --import, tsx, worker-smoke.ts]
    volumes:
      - ${SMOKE_CHECK_FILE:-./worker-smoke.ts}:/app/worker-smoke.ts:ro

networks:
  fixture:
    internal: true

volumes:
  uploads:
