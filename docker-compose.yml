# Production-style stack: Postgres (pgvector) + web + worker.
#   cp .env.example .env   # fill in secrets and choose local, Entra and/or LDAP authentication
#   bash scripts/build-images.sh   # preflight then build; see docs/operations.md for bootstrap/migrations
# Add `--profile demo` to also start the mock LLM for a first look without a real model endpoint.
# Workspaces (sandboxed containers bots can run commands in) are an add-on file: see docker-compose.sandbox.yml.
# Inline web widgets use the separate opt-in mcp-apps profile; see docs/architecture/mcp-apps.md.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}
      POSTGRES_DB: portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      retries: 20

  # Runs every chat reply (the web only records, relays and tails them): chat needs it running.
  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}@db:5432/portal
      # Each running reply writes its stream in small transactions: room for AGENT_RUN_CONCURRENCY (16) of them.
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-20}
      # Pinned to the uploads volume below. environment overrides env_file, so .env.example's dev default
      # (./data/uploads, i.e. /app/data inside the image, not writable) can't send uploads off the volume.
      STORAGE_DIR: /data/uploads
      MCP_APPS_SANDBOX_URL: ${MCP_APPS_SANDBOX_URL:-}
    # A reaper as PID 1 (signals forwarded, zombies reaped), and time for running replies to save on `docker stop`
    # (the worker gives them 20 s, then pg-boss 10 s).
    init: true
    stop_grace_period: 45s
    volumes:
      - uploads:/data/uploads
      # Internal CA certificates (e.g. LDAPS): LDAP_CA_CERT=/etc/portal/certs/<file>.pem. See certs/README.md.
      - ./certs:/etc/portal/certs:ro
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}@db:5432/portal
      STORAGE_DIR: /data/uploads # the uploads volume; see the worker
      # PORT in .env picks the host port below; env_file would also hand it to Next.js, which must stay on 3000.
      PORT: "3000"
      MCP_APPS_SANDBOX_URL: ${MCP_APPS_SANDBOX_URL:-}
    ports:
      # WEB_BIND=127.0.0.1 (or one interface's address) when a reverse proxy on this host terminates TLS.
      - "${WEB_BIND:-0.0.0.0}:${PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
      - ./certs:/etc/portal/certs:ro # see the worker
    depends_on:
      db: { condition: service_healthy }
      worker: { condition: service_started } # the worker applies migrations on start

  # Browser-facing via a dedicated HTTPS reverse proxy origin, never through the portal's origin.
  mcp-app-sandbox:
    profiles: [mcp-apps]
    build: { context: ., target: mcp-app-sandbox }
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    # Deliberately no env_file, volumes, credentials or application network.
    environment:
      MCP_APPS_HOST_ORIGIN: ${MCP_APPS_HOST_ORIGIN:-}
      MCP_APPS_SANDBOX_HOST: "0.0.0.0"
      MCP_APPS_SANDBOX_PORT: "3102"
    ports:
      - "127.0.0.1:${MCP_APPS_SANDBOX_PORT:-3102}:3102"
    networks: [mcp-apps]

  mock-llm:
    profiles: ["demo"]
    image: node:22-slim
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - ./dev/mock-llm:/app:ro
    ports:
      - "4010:4010"

volumes:
  pgdata:
  uploads:

networks:
  mcp-apps:
